{% extends "appointment/base.html" %}
{% block title %}Leave a Review{% endblock %}
{% block content %}

<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card card-soft p-4">
                <h4 class="mb-1">Rate Dr. {{ appointment.doctor.name }}</h4>
                <p class="text-muted small mb-4">How was your visit on {{ appointment.date }}?</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Rating</label>
                        {{ form.rating }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Comment</label>
                        {{ form.comment }}
                    </div>
                    <button type="submit" class="btn btn-brand w-100">Submit Review</button>
                </form>
            </div>
        </div>
    </div>
</section>

{% endblock %}
