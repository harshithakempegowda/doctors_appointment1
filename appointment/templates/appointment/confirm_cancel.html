{% extends "appointment/base.html" %}
{% block title %}Cancel Appointment{% endblock %}
{% block content %}

<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card card-soft p-4 text-center">
                <i class="bi bi-exclamation-triangle-fill text-danger display-4 mb-3"></i>
                <h5>Cancel this appointment?</h5>
                <p class="text-muted small">Dr. {{ appointment.doctor.name }} on {{ appointment.date }} at {{ appointment.time }}</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <a href="javascript:history.back()" class="btn btn-outline-secondary">Keep it</a>
                        <button type="submit" class="btn btn-danger">Yes, Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

{% endblock %}
